# development & demo lokal: docker compose up -d --build
# bukan konfigurasi production (kata sandi default, NODE_ENV=development, WhatsApp tampil di browser)
name: bloodsync

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bloodsync
      MYSQL_USER: bloodsync
      MYSQL_PASSWORD: bloodsync
      MYSQL_ROOT_PASSWORD: bloodsync-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubloodsync", "-pbloodsync"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: mysql://bloodsync:bloodsync@db:3306/bloodsync
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-docker-secret-ganti-sebelum-dipakai-publik
      CORS_ORIGIN: "*"
      # alamat yang dipakai di link pesan WhatsApp; isi url tunnel/domain bila WhatsApp asli aktif
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      UPLOAD_DIR: /app/backend/uploads
      ENABLE_DEMO_ROUTES: "true"
      ENABLE_API_DOCS: "true"
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET:-}
      # notifikasi OTP lokal di browser host; aman karena port hanya dibuka di 127.0.0.1
      DEV_INBOX_TRUST_NETWORK: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  db-data:
  uploads:
