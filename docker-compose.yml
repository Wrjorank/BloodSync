# development & demo lokal: docker compose up -d --build
# bukan konfigurasi production (kata sandi default, NODE_ENV=development, WhatsApp tampil di browser)
name: mhs_bloodsync

services:
  db:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: bloodsync
      MYSQL_USER: bloodsync
      MYSQL_PASSWORD: bloodsync
      MYSQL_ROOT_PASSWORD: bloodsync-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubloodsync", "-pbloodsync"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    container_name: mhs_bloodsync_redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - delcom-external-network
    extra_hosts:
    - "host.docker.internal:host-gateway"

  app:
    container_name: mhs_bloodsync_app
    build: .
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-${DB_NAME:-bloodsync}}
      DB_USERNAME: ${DB_USERNAME:-${DB_USER:-postgres}}
      DB_PASSWORD: ${DB_PASSWORD:-${DB_PASS:-postgres}}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-docker-secret-ganti-sebelum-dipakai-publik
      CORS_ORIGIN: "*"
