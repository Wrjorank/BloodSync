<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pendonor Presisi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23e11d48%22/%3E%3Cpath d=%22M16 6c-4 6-7 9.5-7 13a7 7 0 0 0 14 0c0-3.5-3-7-7-13z%22 fill=%22white%22/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c' } }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        .lbl { @apply block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider; }
        .inp { @apply w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 font-medium text-slate-800 outline-none transition-all focus:border-brand-500 focus:ring-2 focus:ring-brand-100; }
    </style>
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .pulse-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: #f43f5e;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased flex flex-col items-center">
    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative flex flex-col overflow-hidden">

        <header class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-700 px-5 py-4 flex items-center justify-between text-white shrink-0 border-b border-slate-700">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fa-solid fa-droplet text-brand-500"></i>
                <span class="font-bold text-lg">Donor Presisi</span>
            </a>
            <button id="btnLogout" class="hidden text-slate-300 hover:text-white text-sm font-semibold"><i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar</button>
        </header>

        <main class="flex-grow flex flex-col">

            <!-- entry: phone + otp, then registration only for new numbers -->
            <div id="regView" class="p-6">
                <div class="text-center mb-7 mt-2">
                    <div class="w-20 h-20 bg-brand-50 rounded-full flex items-center justify-center mx-auto mb-4 text-brand-500 text-3xl">
                        <i class="fa-solid fa-hand-holding-heart"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900">Jadilah Pahlawan</h2>
                    <p class="text-sm text-slate-500 mt-2">Anda hanya dihubungi saat golongan darah cocok, Anda berada di dekat faskes, dan tubuh Anda siap donor.</p>
                </div>

                <div id="phoneStep" class="space-y-3">
                    <label class="lbl" for="donorPhone">Nomor HP / WhatsApp</label>
                    <div class="flex gap-2">
                        <input type="tel" id="donorPhone" class="inp" placeholder="08xxxxxxxxxx" autocomplete="tel">
                        <button type="button" id="btnSendOtp" class="shrink-0 px-4 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800">Kirim OTP</button>
                    </div>
                    <div id="otpRow" class="hidden flex gap-2">
                        <input type="text" id="donorOtp" inputmode="numeric" maxlength="6" class="inp tracking-[0.4em] text-center" placeholder="••••••">
                        <button type="button" id="btnVerifyOtp" class="shrink-0 px-4 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700">Verifikasi</button>
                    </div>
                    <p class="text-xs text-slate-400">Nomor terdaftar langsung masuk. Nomor baru lanjut ke pendaftaran profil.</p>
                    <div class="pt-4 border-t border-slate-100">
                        <select id="demoDonor" class="inp text-sm">
                            <option value="" selected>Atau masuk cepat sebagai pendonor terdaftar…</option>
                        </select>
                    </div>
                </div>

                <form id="donorRegForm" class="hidden space-y-4">
                    <p class="text-xs font-semibold text-green-600"><i class="fa-solid fa-circle-check"></i> <span id="regPhoneLabel"></span> terverifikasi</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="col-span-2">
                            <label class="lbl" for="donorName">Nama</label>
                            <input type="text" id="donorName" required minlength="2" class="inp" placeholder="Nama lengkap">
                        </div>
                        <div>
                            <label class="lbl" for="donorAbo">Golongan</label>
                            <select id="donorAbo" required class="inp">
                                <option value="" disabled selected>Pilih</option>
                                <option>A</option><option>B</option><option>AB</option><option>O</option>
                            </select>
                        </div>
                        <div>
                            <label class="lbl" for="donorRh">Rhesus</label>
                            <select id="donorRh" required class="inp">
                                <option value="+">Positif (+)</option>
                                <option value="-">Negatif (−)</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="lbl" for="donorLastDate">Terakhir donor (opsional)</label>
                            <input type="date" id="donorLastDate" class="inp">
                        </div>
                        <div class="col-span-2">
                            <label class="lbl" for="donorArea">Lokasi Anda (kecamatan)</label>
                            <select id="donorArea" required class="inp"></select>
                        </div>
                    </div>

                    <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl space-y-3">
                        <label class="flex gap-3 text-xs text-blue-800 leading-relaxed cursor-pointer">
                            <input type="checkbox" id="consentNotif" required class="w-5 h-5 mt-0.5 shrink-0 accent-brand-600">
                            <span>Izinkan <b>notifikasi push</b> untuk panggilan darurat (maks. <span id="alertCap">3</span> kali per minggu).</span>
                        </label>
                        <label class="flex gap-3 text-xs text-blue-800 leading-relaxed cursor-pointer">
                            <input type="checkbox" id="consentGps" required class="w-5 h-5 mt-0.5 shrink-0 accent-brand-600">
                            <span>Izinkan akses <b>geolokasi</b> agar sistem hanya memanggil saat saya dekat faskes. Lokasi tidak dibagikan ke publik.</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition-colors shadow-lg shadow-slate-200">Aktifkan Profil</button>
                </form>
            </div>

            <!-- dashboard -->
            <div id="dashView" class="hidden flex-col flex-grow bg-slate-50">
                <div class="bg-brand-600 rounded-b-3xl px-6 pb-7 pt-3 text-white shadow-sm">
                    <div class="flex items-center gap-4 mb-4">
                        <div id="dashInitial" class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center font-bold text-xl border border-white/30"></div>
                        <div class="min-w-0">
                            <p class="text-brand-200 text-xs uppercase tracking-wider font-bold">Halo,</p>
                            <h2 class="text-xl font-bold truncate" id="dashName"></h2>
                            <p class="text-xs text-brand-100" id="dashArea"></p>
                            <button id="btnGps" type="button" class="mt-1 text-[11px] font-semibold text-white/90 hover:text-white underline underline-offset-2"><i class="fa-solid fa-location-crosshairs mr-1"></i><span>Perbarui lokasi GPS</span></button>
                        </div>
                    </div>
                    <div class="bg-white/10 rounded-2xl p-4 border border-white/20 flex items-center justify-between">
                        <div>
                            <span class="block text-brand-200 text-xs mb-1">Status kesiapan</span>
                            <span class="font-bold flex items-center gap-1.5 text-sm" id="dashEligible"></span>
                        </div>
                        <div class="text-right">
                            <span class="block text-brand-200 text-xs mb-1">Gol. darah</span>
                            <span class="font-bold text-xl" id="dashBlood"></span>
                        </div>
                    </div>
                </div>

                <div id="reminder" class="hidden mx-5 mt-5"></div>
                <div id="mainArea" class="p-5"></div>

                <section class="px-5 pb-8 space-y-4">
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm mb-3">Lencana kontribusi</h3>
                        <div id="badgeList" class="grid grid-cols-3 gap-2"></div>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm mb-3">Riwayat donor</h3>
                        <div id="donationList" class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100"></div>
                    </div>
                    <div id="availability" class="text-center pt-2"></div>
                </section>
            </div>
        </main>

        <!-- targeted push notification -->
        <div id="inviteModal" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex-col items-center justify-end p-4 pb-8">
            <div class="bg-white w-full rounded-3xl p-5 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-brand-500 animate-pulse"></div>
                <div id="inviteBody"></div>
                <div class="flex gap-3 mt-5">
                    <button id="btnDecline" class="flex-1 py-3.5 rounded-xl font-bold text-sm text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors">Tidak Bisa</button>
                    <button id="btnAccept" class="flex-1 py-3.5 rounded-xl font-bold text-sm text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/30 transition-all active:scale-95">Siap Mendonor</button>
                </div>
            </div>
        </div>
    </div>

    <script src="store.js"></script>
    <script src="ui.js"></script>
    <script src="pendonor.js"></script>
</body>
</html>
