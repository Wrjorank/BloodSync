name: bloodsync
description: "Aplikasi BloodSync: pendonor (panggilan darurat, tiket QR, riwayat) dan pengajuan darah keluarga pasien."
publish_to: none
version: 1.0.0-beta+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.0.2
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.4
  share_plus: ^12.0.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
